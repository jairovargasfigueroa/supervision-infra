# 602 · AMQPS en 5671 con el certificado de Let's Encrypt de rabbitmq.<dominio> (lo saca Caddy; lo copia
# maquina/certificado-rabbitmq.sh): rabbitmq.crt es el certificado del nombre y cadena.crt los intermedios. Los
# clientes lo verifican con las CA públicas de su sistema; RabbitMQ no pide certificado a los clientes (entran con
# usuario y contraseña). El 5672 sin TLS sigue solo para n8n, dentro de la red de la máquina (no se publica).
listeners.ssl.default = 5671
ssl_options.cacertfile = /certificados/cadena.crt
ssl_options.certfile = /certificados/rabbitmq.crt
ssl_options.keyfile = /certificados/rabbitmq.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
