# 601 · AMQPS en 5671 con el certificado de la CA local (certificados.ps1/.sh). Los clientes verifican el certificado
# del servidor con la CA; RabbitMQ no pide certificado a los clientes (entran con usuario y contraseña).
# El 5672 sin TLS sigue para n8n, dentro de la red del grupo (no se publica en la máquina).
listeners.ssl.default = 5671
ssl_options.cacertfile = /certificados/ca.crt
ssl_options.certfile = /certificados/rabbitmq.crt
ssl_options.keyfile = /certificados/rabbitmq.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
