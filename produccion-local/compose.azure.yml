# 601 · «Producción local», grupo azure (hace de la nube de Azure; reparto de la 602). Variables: .env de esta carpeta.
# Corre las imágenes de producción con su configuración de producción. Habla con los otros grupos solo por sus
# direcciones públicas (https://<pieza>.<grupo>.localhost:<puerto>, por Caddy) y RabbitMQ por AMQPS (5671): dentro
# de los contenedores esos nombres apuntan a la máquina (extra_hosts: host-gateway). README de infra, «Producción local».
name: supervision-azure

x-nombres-publicos: &nombres-publicos
  - "keycloak.azure.localhost:host-gateway"
  - "rabbitmq.azure.localhost:host-gateway"
  - "gateway.azure.localhost:host-gateway"
  - "obras.azure.localhost:host-gateway"
  - "finanzas.azure.localhost:host-gateway"
  - "materiales.google.localhost:host-gateway"
  - "ia.google.localhost:host-gateway"
  - "sincronizacion.aws.localhost:host-gateway"
  - "s3.aws.localhost:host-gateway"

# Finanzas: la misma imagen para la API y los procesos en segundo plano (cambia el comando)
x-finanzas: &finanzas
  build: ${FINANZAS_DIR:-../../services/finanzas}
  image: ${IMAGENES:-ghcr.io/jairovargasfigueroa}/supervision-ms-finanzas:${IMAGEN_ETIQUETA:-local}
  extra_hosts:
    - "keycloak.azure.localhost:host-gateway"
    - "rabbitmq.azure.localhost:host-gateway"
    # Destino del reenvío de finanzas-reenvio (comparte la red de finanzas-api)
    - "host.docker.internal:host-gateway"
  volumes:
    - ./certificados:/certificados:ro
    # La CA local para curl (JWKS de Keycloak) y OpenSSL (AMQPS); en la nube no hace falta
    - ./finanzas/ca-local.ini:/usr/local/etc/php/conf.d/zz-ca-local.ini:ro
  environment:
    APP_NAME: Finanzas
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${FINANZAS_APP_KEY:?falta FINANZAS_APP_KEY en .env}
    APP_URL: ${FINANZAS_URL}
    APP_TIMEZONE: America/La_Paz
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: finanzas_db
    DB_USERNAME: finanzas
    DB_PASSWORD: ${POSTGRES_FINANZAS_CLAVE:?falta POSTGRES_FINANZAS_CLAVE en .env}
    # Red interna del grupo (en la nube, PostgreSQL administrado con require)
    DB_SSLMODE: disable
    RABBITMQ_HOST: ${RABBITMQ_HOST}
    RABBITMQ_PORT: ${RABBITMQ_PUERTO_TLS}
    RABBITMQ_USER: finanzas
    RABBITMQ_PASSWORD: ${RABBITMQ_FINANZAS_CLAVE:?falta RABBITMQ_FINANZAS_CLAVE en .env}
    RABBITMQ_SSL: "true"
    KEYCLOAK_ISSUER: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
    KEYCLOAK_AUDIENCIA: plataforma-api
    EMPRESA_NOMBRE: ${EMPRESA_NOMBRE:-Constructora Andina}

services:
  # PostgreSQL de Obras, Finanzas y Keycloak (en la nube: PostgreSQL administrado). Sin puerto en la máquina.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE:?falta POSTGRES_CLAVE en .env}
      POSTGRES_OBRAS_CLAVE: ${POSTGRES_OBRAS_CLAVE:?falta POSTGRES_OBRAS_CLAVE en .env}
      POSTGRES_FINANZAS_CLAVE: ${POSTGRES_FINANZAS_CLAVE:?falta POSTGRES_FINANZAS_CLAVE en .env}
      POSTGRES_KEYCLOAK_CLAVE: ${POSTGRES_KEYCLOAK_CLAVE:?falta POSTGRES_KEYCLOAK_CLAVE en .env}
    volumes:
      - ./postgres/iniciar-azure.sh:/docker-entrypoint-initdb.d/01-bases.sh:ro
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # RabbitMQ con AMQPS en 5671 (certificado de la CA local) para los servicios de todos los grupos; 5672 solo para
  # n8n, en la red interna del grupo (como en la VM de la 602)
  rabbitmq:
    image: rabbitmq:4.4-management
    hostname: rabbitmq
    ports:
      - "5671:5671"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USUARIO:?falta RABBITMQ_ADMIN_USUARIO en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_CLAVE:?falta RABBITMQ_ADMIN_CLAVE en .env}
    volumes:
      - ./rabbitmq/tls.conf:/etc/rabbitmq/conf.d/20-tls.conf:ro
      - ./certificados:/certificados:ro
      - datos-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Las mismas definiciones y usuarios que en desarrollo (../rabbitmq), con las contraseñas de este .env
  rabbitmq-init:
    image: curlimages/curl:8.17.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USUARIO: ${RABBITMQ_ADMIN_USUARIO}
      RABBITMQ_ADMIN_CLAVE: ${RABBITMQ_ADMIN_CLAVE}
      RABBITMQ_OBRAS_CLAVE: ${RABBITMQ_OBRAS_CLAVE:?falta RABBITMQ_OBRAS_CLAVE en .env}
      RABBITMQ_MATERIALES_CLAVE: ${RABBITMQ_MATERIALES_CLAVE:?falta RABBITMQ_MATERIALES_CLAVE en .env}
      RABBITMQ_FINANZAS_CLAVE: ${RABBITMQ_FINANZAS_CLAVE:?falta RABBITMQ_FINANZAS_CLAVE en .env}
      RABBITMQ_IA_CLAVE: ${RABBITMQ_IA_CLAVE:?falta RABBITMQ_IA_CLAVE en .env}
      RABBITMQ_N8N_CLAVE: ${RABBITMQ_N8N_CLAVE:?falta RABBITMQ_N8N_CLAVE en .env}
    volumes:
      - ../rabbitmq/iniciar.sh:/iniciar.sh:ro
      - ../rabbitmq/definiciones.json:/definiciones.json:ro
    entrypoint: ["sh", "/iniciar.sh"]
    restart: "no"

  # Keycloak en modo producción (start) con su base en PostgreSQL, detrás de Caddy. KC_HOSTNAME fija la dirección
  # pública: el emisor de los tokens es siempre KEYCLOAK_URL/realms/supervision, aunque se le hable por la red interna.
  # Importa el realm solo si no existe (con la base vacía); toma de aquí las direcciones, la clave de los usuarios de
  # prueba y los secretos de los clientes (docs/contratos.md, «Importar para producción»).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO:?falta KEYCLOAK_ADMIN_USUARIO en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_CLAVE:?falta KEYCLOAK_ADMIN_CLAVE en .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_CLAVE}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      ERP_URL: ${ERP_URL}
      PORTAL_URL: ${PORTAL_URL}
      USUARIOS_PRUEBA_CLAVE: ${USUARIOS_PRUEBA_CLAVE:?falta USUARIOS_PRUEBA_CLAVE en .env}
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET:?falta KEYCLOAK_GATEWAY_CLIENT_SECRET en .env}
      IA_REPORTES_CLIENT_SECRET: ${IA_REPORTES_CLIENT_SECRET:?falta IA_REPORTES_CLIENT_SECRET en .env}
      IA_AGENTES_CLIENT_SECRET: ${IA_AGENTES_CLIENT_SECRET:?falta IA_AGENTES_CLIENT_SECRET en .env}
      N8N_KEYCLOAK_SECRETO: ${N8N_KEYCLOAK_SECRETO:?falta N8N_KEYCLOAK_SECRETO en .env}
    volumes:
      - ../keycloak/realm-supervision.json:/opt/keycloak/data/import/realm-supervision.json:ro
      - ../keycloak/temas/supervision:/opt/keycloak/themes/supervision:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  obras:
    build: ${OBRAS_DIR:-../../services/obras}
    image: ${IMAGENES:-ghcr.io/jairovargasfigueroa}/supervision-ms-obras:${IMAGEN_ETIQUETA:-local}
    extra_hosts: *nombres-publicos
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OBRAS_PORT: "8081"
      OBRAS_DB_HOST: postgres
      OBRAS_DB_PORT: "5432"
      OBRAS_DB_NAME: obras_db
      OBRAS_DB_USER: obras
      OBRAS_DB_PASSWORD: ${POSTGRES_OBRAS_CLAVE}
      OBRAS_DB_SSLMODE: disable
      OBRAS_KEYCLOAK_ISSUER: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
      OBRAS_RABBITMQ_HOST: ${RABBITMQ_HOST}
      OBRAS_RABBITMQ_PORT: ${RABBITMQ_PUERTO_TLS}
      OBRAS_RABBITMQ_USER: obras
      OBRAS_RABBITMQ_PASSWORD: ${RABBITMQ_OBRAS_CLAVE}
      OBRAS_RABBITMQ_SSL: "true"
      # Fotos en el S3 compatible del grupo aws (MinIO)
      OBRAS_S3_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      OBRAS_S3_BUCKET: ${S3_BUCKET}
      OBRAS_S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      OBRAS_S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      OBRAS_CORS_ORIGENES: ${PORTAL_URL}
      # La CA local como truststore de Java (certificados.ps1/.sh genera ca.p12); en la nube no hace falta
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certificados/ca.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./certificados:/certificados:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_started
    restart: unless-stopped

  finanzas-api:
    <<: *finanzas
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_started
    restart: unless-stopped

  # Solo en el ensayo: PHP pide el JWKS de Keycloak con libcurl, que resuelve *.localhost siempre a la propia máquina
  # (RFC 6761) e ignora extra_hosts. Este reenvío, en la red de finanzas-api, lleva 127.0.0.1:8443 (y ::1) al Caddy
  # de azure en la máquina: el pedido sale con el mismo nombre y certificado (comprobado el 03/11/2026 con curl 8.17).
  # Usa el Node de la imagen de n8n (ya está en el grupo) y el reenviador de n8n. En la nube no hace falta.
  finanzas-reenvio:
    image: n8nio/n8n:2.43.7
    network_mode: "service:finanzas-api"
    entrypoint: ["node", "/reenviar.mjs"]
    environment:
      REENVIO_KEYCLOAK_HOST: host.docker.internal
      REENVIO_KEYCLOAK_PUERTO: "8443"
      REENVIO_ESCUCHA_PUERTO: "8443"
    volumes:
      - ../n8n/reenviar-keycloak.mjs:/reenviar.mjs:ro
    depends_on:
      finanzas-api:
        condition: service_started
    restart: unless-stopped

  # Consumidor, publicador del outbox y tareas programadas de Finanzas: la misma imagen con otro comando, una réplica
  # (como «Finanzas en segundo plano» de la 602). Si uno de los tres termina, el contenedor se reinicia entero.
  finanzas-trabajos:
    <<: *finanzas
    command:
      - bash
      - -c
      - php artisan mensajeria:consumir & php artisan mensajeria:publicar & php artisan schedule:work & wait -n; exit $$?
    healthcheck:
      disable: true
    depends_on:
      finanzas-api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build: ${GATEWAY_DIR:-../../gateway}
    image: ${IMAGENES:-ghcr.io/jairovargasfigueroa}/supervision-gateway:${IMAGEN_ETIQUETA:-local}
    extra_hosts: *nombres-publicos
    environment:
      NODE_ENV: production
      PORT: "4000"
      OBRAS_URL: ${OBRAS_URL}
      MATERIALES_URL: ${MATERIALES_URL}
      FINANZAS_URL: ${FINANZAS_URL}
      IA_URL: ${IA_URL}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_GATEWAY_CLIENT_ID: gateway
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET}
      # Los microfrontends corren dentro de la página del shell: solo su origen
      CORS_ORIGENES: ${ERP_URL}
      NODE_EXTRA_CA_CERTS: /certificados/ca.crt
    volumes:
      - ./certificados:/certificados:ro
    depends_on:
      keycloak:
        condition: service_healthy
      caddy:
        condition: service_started
    restart: unless-stopped

  # 201 y 010 · Los mismos flujos y credenciales que en desarrollo (../n8n). Keycloak por la red interna (el reenvío
  # de localhost:8080 de iniciar.sh apunta a keycloak:8080; el emisor del token es KC_HOSTNAME igual); Obras,
  # Finanzas y Materiales por sus direcciones públicas con HTTPS; RabbitMQ y Mailpit por la red interna del grupo.
  n8n:
    image: n8nio/n8n:2.43.7
    entrypoint: ["tini", "--", "sh", "/n8n-config/iniciar.sh"]
    extra_hosts: *nombres-publicos
    environment:
      GENERIC_TIMEZONE: America/La_Paz
      TZ: America/La_Paz
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY en .env}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_PROPIETARIO_CORREO:?falta N8N_PROPIETARIO_CORREO en .env}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_PROPIETARIO_CLAVE_HASH:?falta N8N_PROPIETARIO_CLAVE_HASH en .env}
      N8N_INSTANCE_OWNER_FIRST_NAME: Administración
      N8N_INSTANCE_OWNER_LAST_NAME: Cobranzas
      N8N_KEYCLOAK_SECRETO: ${N8N_KEYCLOAK_SECRETO}
      RABBITMQ_N8N_CLAVE: ${RABBITMQ_N8N_CLAVE}
      FINANZAS_URL: ${FINANZAS_URL}
      OBRAS_URL: ${OBRAS_URL}
      MATERIALES_URL: ${MATERIALES_URL}
      KEYCLOAK_URL: http://localhost:8080
      EMPRESA_NOMBRE: ${EMPRESA_NOMBRE:-Constructora Andina}
      COBRANZA_REMITENTE: ${COBRANZA_REMITENTE:-cobranzas@constructora-andina.test}
      COBRANZA_CORREO: ${COBRANZA_CORREO:-cobranzas@constructora-andina.test}
      PORTAL_URL: ${PORTAL_URL}
      # Sin Firebase en el ensayo: los flujos de push se importan sin publicar
      FIREBASE_PROYECTO_ID: ""
      FIREBASE_CUENTA_CORREO: ""
      FIREBASE_CLAVE_PRIVADA: ""
      REENVIO_KEYCLOAK_HOST: keycloak
      REENVIO_KEYCLOAK_PUERTO: "8080"
      NODE_EXTRA_CA_CERTS: /certificados/ca.crt
    volumes:
      - ../n8n:/n8n-config:ro
      - ./certificados:/certificados:ro
      - datos-n8n:/home/node/.n8n
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz/readiness').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  # Buzón de prueba (en la 602 también, «Correo en producción»): SMTP en mailpit:1025 dentro del grupo; interfaz y
  # API por Caddy (MAILPIT_URL)
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      TZ: America/La_Paz
      MP_DISABLE_VERSION_CHECK: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # HTTPS del grupo (8443) con la CA local; además sirve los 5 frontends compilados (sitios/, publicar-frontends)
  caddy:
    image: caddy:2.11.7-alpine
    ports:
      - "8443:8443"
    environment:
      ERP_URL: ${ERP_URL}
    volumes:
      - ./caddy/Caddyfile.azure:/etc/caddy/Caddyfile:ro
      - ./caddy/global.caddy:/etc/caddy/global.caddy:ro
      - ./caddy/comun.caddy:/etc/caddy/comun.caddy:ro
      - ./certificados:/certificados:ro
      - ./sitios:/sitios:ro
      - datos-caddy:/data
    restart: unless-stopped

volumes:
  datos-postgres:
  datos-rabbitmq:
  datos-n8n:
  datos-caddy:
