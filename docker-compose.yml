# Entorno de desarrollo. Versiones y puertos: docs/entorno-local.md de supervision-docs.
# Sin perfil: RabbitMQ, Keycloak y DynamoDB Local. Con --profile bases: también PostgreSQL y MongoDB.
# Con --profile ia: ia-api e ia-worker construidos desde services/ia (401). Opcional: también se corren con uv.
name: supervision

# 401 · Servicio de IA en contenedor: una sola imagen para sus tres procesos (Dockerfile de services/ia).
# PostgreSQL (5433), MongoDB y Obras, Materiales y Finanzas se alcanzan en la máquina (host.docker.internal), como
# cuando se corren sin Docker; RabbitMQ y Keycloak, dentro del Compose. Keycloak se alcanza como localhost:8080
# gracias a ia/reenviar-keycloak.py, para que el emisor de los tokens sea el mismo que validan los demás servicios.
x-ia: &ia
  build: ${IA_DIR:-../services/ia}
  image: supervision-ia:dev
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./ia/reenviar-keycloak.py:/reenviar-keycloak.py:ro

x-ia-entorno: &ia-entorno
  IA_ENTORNO: desarrollo
  IA_PUERTO: "8085"
  IA_REPORTES_DB_URL: postgresql+psycopg://ia:${POSTGRES_IA_CLAVE}@host.docker.internal:5433/reportes_db
  IA_MONGO_URL: mongodb://host.docker.internal:27017/?directConnection=true
  IA_MONGO_DB: ia_db
  IA_RABBITMQ_URL: amqp://ia:${RABBITMQ_IA_CLAVE}@rabbitmq:5672/
  IA_KEYCLOAK_ISSUER: http://localhost:8080/realms/supervision
  IA_AUDIENCIA: plataforma-api
  IA_ZONA_HORARIA: America/La_Paz
  # El secreto de ia-reportes solo lo recibe ia-carga-inicial (401, «Token»)
  IA_REPORTES_CLIENT_SECRET: ""

# Arranca el reenvío de localhost:8080 a Keycloak, espera a que escuche y ejecuta el proceso del servicio
x-ia-con-keycloak: &ia-con-keycloak >-
  python /reenviar-keycloak.py &
  until python -c "import socket; socket.create_connection(('127.0.0.1', 8080), 1)" 2>/dev/null; do sleep 0.2; done;
  exec "$$@"

services:
  rabbitmq:
    image: rabbitmq:4.4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USUARIO:?falta RABBITMQ_ADMIN_USUARIO en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_CLAVE:?falta RABBITMQ_ADMIN_CLAVE en .env}
    volumes:
      - datos-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Importa las definiciones (exchange, colas y enlaces) y crea un usuario por servicio con las contraseñas de .env; termina.
  rabbitmq-init:
    image: curlimages/curl:8.17.0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: http://rabbitmq:15672
      RABBITMQ_ADMIN_USUARIO: ${RABBITMQ_ADMIN_USUARIO}
      RABBITMQ_ADMIN_CLAVE: ${RABBITMQ_ADMIN_CLAVE}
      RABBITMQ_OBRAS_CLAVE: ${RABBITMQ_OBRAS_CLAVE:?falta RABBITMQ_OBRAS_CLAVE en .env}
      RABBITMQ_MATERIALES_CLAVE: ${RABBITMQ_MATERIALES_CLAVE:?falta RABBITMQ_MATERIALES_CLAVE en .env}
      RABBITMQ_FINANZAS_CLAVE: ${RABBITMQ_FINANZAS_CLAVE:?falta RABBITMQ_FINANZAS_CLAVE en .env}
      RABBITMQ_IA_CLAVE: ${RABBITMQ_IA_CLAVE:?falta RABBITMQ_IA_CLAVE en .env}
      RABBITMQ_NOTIFICACIONES_CLAVE: ${RABBITMQ_NOTIFICACIONES_CLAVE:?falta RABBITMQ_NOTIFICACIONES_CLAVE en .env}
    volumes:
      - ./rabbitmq/iniciar.sh:/iniciar.sh:ro
      - ./rabbitmq/definiciones.json:/definiciones.json:ro
    entrypoint: ["sh", "/iniciar.sh"]
    restart: "no"

  # Base H2 dentro del contenedor (sin volumen): al recrearlo (bajar y levantar) el realm se vuelve a importar.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO:?falta KEYCLOAK_ADMIN_USUARIO en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_CLAVE:?falta KEYCLOAK_ADMIN_CLAVE en .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      # El tema se lee del disco en cada petición: los cambios se ven sin reiniciar
      KC_SPI_THEME__CACHE_THEMES: "false"
      KC_SPI_THEME__CACHE_TEMPLATES: "false"
    volumes:
      - ./keycloak/realm-supervision.json:/opt/keycloak/data/import/realm-supervision.json:ro
      - ./keycloak/temas/supervision:/opt/keycloak/themes/supervision:ro
    healthcheck:
      # La imagen no trae curl: se pide /health/ready al puerto de gestión con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  postgres:
    image: postgres:17
    profiles: ["bases"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE:?falta POSTGRES_CLAVE en .env}
      # 401: contraseña del usuario ia, dueño de reportes_db (la usa init-reportes.sh)
      POSTGRES_IA_CLAVE: ${POSTGRES_IA_CLAVE:?falta POSTGRES_IA_CLAVE en .env}
    volumes:
      # Corren en orden de nombre y solo con el volumen vacío
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-bases.sql:ro
      - ./postgres/init-reportes.sh:/docker-entrypoint-initdb.d/02-reportes.sh:ro
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d obras_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:8.0
    profiles: ["bases"]
    hostname: mongo
    # Replica set de un nodo: lo necesitan las transacciones del outbox de Materiales
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - datos-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Ejecuta rs.initiate() una vez que MongoDB responde y termina.
  mongo-init:
    image: mongo:8.0
    profiles: ["bases"]
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./mongo/iniciar-replica.js:/iniciar-replica.js:ro
    command: ["mongosh", "--quiet", "mongodb://mongo:27017/?directConnection=true", "/iniciar-replica.js"]
    restart: "no"

  # DynamoDB Local para el servicio de Sincronización (101). -sharedDb: una sola base para cualquier
  # credencial y región (las pruebas y el servicio ven las mismas tablas). Las tablas las crea
  # Sincronización al iniciar con DYNAMODB_CREAR_TABLAS=true.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    working_dir: /home/dynamodblocal
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    # El volumen se crea con dueño root: el usuario de la imagen (dynamodblocal) no podría escribir en él
    user: root
    ports:
      - "8000:8000"
    volumes:
      - datos-dynamodb:/home/dynamodblocal/data
    healthcheck:
      # Sin credenciales responde 400 (MissingAuthenticationToken): basta con que conteste
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # AWS CLI para subir y borrar las fotos de los datos de prueba (011) en el bucket S3 de desarrollo.
  # Herramienta de una sola vez: se usa con "docker compose --profile herramientas run --rm s3-cli s3 ...";
  # los scripts de semilla/ rechazan cualquier bucket que no empiece con supervision-dev-.
  s3-cli:
    image: amazon/aws-cli:2.38.0
    profiles: ["herramientas"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-sa-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - ./semilla/fotos:/semilla/fotos:ro
    # Sin argumentos solo muestra la versión y termina bien (así "levantar -Perfil herramientas" no falla)
    command: ["--version"]
    restart: "no"

  # 401 · API del servicio de IA (puerto 8085). Aplica las migraciones de reportes_db (alembic) antes de atender.
  ia-api:
    <<: *ia
    profiles: ["ia"]
    command: ["sh", "-c", "alembic upgrade head && exec ia-api"]
    entrypoint: ["sh", "-c", *ia-con-keycloak, "--"]
    ports:
      - "8085:8085"
    environment:
      <<: *ia-entorno
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/salud', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 401 · Consumidor de la cola ia y tareas programadas. Espera a ia-api, que deja reportes_db migrada.
  ia-worker:
    <<: *ia
    profiles: ["ia"]
    command: ["ia-worker"]
    entrypoint: ["sh", "-c", *ia-con-keycloak, "--"]
    environment:
      <<: *ia-entorno
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      ia-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos-rabbitmq:
  datos-postgres:
  datos-mongo:
  datos-dynamodb:
